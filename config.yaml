# Design knobs for the sizing pipeline.
# Edit values here and run `python main.py`. The loader at pipeline/config.py
# reads this file and exposes each section as a dataclass on the same module.

# Wing airfoil: .dat path or NACA digits (e.g. "2412"). Set to null to prompt at runtime.
airfoil: "airfoils/E423.dat"

# Tail airfoil: .dat path or NACA digits. Symmetric sections are typical.
tail_airfoil: "airfoils/NACA0010.dat"

# Alpha sweep used to build the wing drag polar for the CL/CD plot [deg].
# [start, end, n_points]
alpha_sweep_deg: [-2.0, 12.0, 30]

# Coarser sweep used inside the iteration loop to find max-L/D CL each pass.
alpha_sweep_loop_deg: [-2.0, 12.0, 140]

# ----- Convergence loop -----
mass_closure: true
sw_closure: true
n_iter_max: 20
cd0_tol: 1.0e-4
mass_tol: 1.0e-3   # kg
sw_tol: 1.0e-3     # m²

# ----- Stall constraint -----
V_stall: 14.0

# ----- CG tuning -----
# battery_x is an initial guess for the longitudinal trim loop. Set null to
# start from the default rod-midpoint location; the pipeline retunes it so the
# final CG lies on the scissor-plot stability line.
battery_x: -0.3

# Vertical battery placement when battery_y0 and battery_y_frac are unset:
#   low    -> lowest feasible battery bottom
#   middle -> battery centered vertically in the fuselage box
#   high   -> highest feasible battery bottom inside the fuselage
#   energy -> sample the feasible range and pick lowest cruise energy
battery_y_mode: middle
battery_y_samples: 9

# Optional maximum payload cable tension per drone [N] used for payload
# disturbance sizing/checks of aileron and elevator. Set null to fall back
# to the legacy weight/drag-derived payload force model.
payload_max_tension: 700

# ----- Initial / wing sizing -----
# ----- Initial / wing sizing -----
sizing:
  m_payload: 60
  m_drone_empty: 8
  n_drones: 3
  b: 3.0
  AR: 7.5
  lam: 1.0
  Cd0: 0.03
  S_payload: 0.31
  Cd_payload: 1.05
  h_cruise: 100
  V_cruise: 20
  v_max: 30.0
  gust_speed: 5.0
  R: 20000
  foam_density: 48
  Vv: 0.04
  Vh: 0.50
  max_nose_to_tailback_length: 3.0  # [m] maximum allowed nose-tip → tail-boom-back length (None disables)
  ARt: 4.5
  lam_t: 1.0
  SM: 0.05          # static stability margin x_cg/c [-]; typical 0.05–0.15

# ----- Propulsion -----
propulsion:
  csv_prop: data\12x8E_performance.csv
  n_props: 3
  prop_mass: 0.1
  eff_motor: 0.8
  T_W_to: 2.0
  throttle_max: 0.9
  climb_rate: 3.333333
  t_climb: 30
  n_cells: 6
  voltage_cell: 3.7
  battery_density: 250
  DoD: 0.8
  cruise_rpm_init: 7000
  climb_rpm_init: 12000
  rpm_tol: 1.0
  thrust_tol: 1.0
  max_iter: 200
  rpm_step: 50.0
  vtol_rpm_init: 5000
  vtol_thrust_tol: 2.0
  vtol_max_iter: 400
  vtol_rpm_step: 25.0
  verbose: false

# ----- Fuselage -----
# Battery dimensions: off-the-shelf envelope unless both aspect ratios are > 0,
# in which case dimensions are recomputed from the required battery volume.
fuselage:
  battery_length: 0.212
  battery_width: 0.090
  battery_height: 0.060
  AR_lw: 2.355555555555556   # length / width  (= 0.212 / 0.090)
  AR_lh: 3.533333333333333   # length / height (= 0.212 / 0.060)
  casing_factor: 1.15        # all-around EPP foam wall margin (~7.5% per side)
  casing_thickness: 0.001    # [m] minimum hard wall thickness
  tube_tail_overlap: 0.03    # [m] tube extension aft of aileron hinge for boom grip
  tube_clearance_factor: 1.10 # [-] structural tube OD / largest attached rod OD
  battery_top_cover_thickness: 0.005 # [m] EPP cover above battery
  min_foam_floor: 0.005      # [m] minimum fuselage thickness below tail boom
  nose_fraction: 0.15        # [-] nose length fraction of total aero fuselage length
  tail_fraction: 0.30        # [-] tail taper length fraction of total aero fuselage length

# ----- Aileron / control surface -----
control_surface:
  cl_alpha: 6.283185307179586
  cd0_section: 0.04
  roll_moment_dist: 0.0
  roll_rate_req_deg_s: 47.0  # [deg/s] required steady roll rate for aileron sizing
  max_da_deg: 20.0
  max_y_frac: 0.9
  payload_lateral_angle_deg: 30.0  # [deg] max payload lateral angle from vertical
  c_aileron_to_c_wing: 0.3

# ----- Elevator -----
elevator:
  trim_mode: tail_incidence  # tail_incidence or payload_attachment
  cE_ch: 0.40  # [-] elevator chord / horizontal-tail chord
  eta_h: 0.85
  Cm_dist: 0.0
  max_deflection_up_deg: 25.0
  max_deflection_down_deg: 25.0
  payload_cable_min_angle_deg: -75
  tail_clmax_fraction: 0.4  # [-] allowed fraction of finite-tail CL_max
  payload_cable_max_angle_deg: 75  # null -> 2 × equilibrium cable angle

# ----- Rudder -----
rudder:
  bR_bV: # [-] rudder span / vertical-tail span
  cR_cV: 0.4  # [-] rudder chord / vertical-tail chord
  max_deflection_deg: 30 # [deg] maximum rudder deflection
  front_prop_lateral_position: 0.33204 #[m] lateral arm of failed front prop for OEI yaw sizing
  oei_failed_thrust_fraction: 0.3333333333333333  # [-] failed thrust / total drone thrust
  Cn_dist: 0.0
  Cn_beta: 0.05
  CDY: 0.8
  Kf1: 0.65
  Kf2: 0.75
  eta_v: 0.85
  Ss: null

# ----- CFRP rod sizing -----
structure:
  safety_factor: 1.5
  defl_max: 0.05
  d_to_section_ratio: 0.8  # [-] hard max rod OD / local airfoil height
  t_t: 0.0015          # [m] minimum tail boom wall thickness
  rod_connector_mass: 0.120  # [kg] mass per rod connector (3 total)
  tail_tc: 0.10
  # Minimum wall thicknesses [m]
  t_spar: 0.001
  t_control: 0.001
  t_spar_ht: 0.001
  t_control_ht: 0.001
  t_spar_vt: 0.001
  t_control_vt: 0.001
  # Tip deflection limits
  wing_tip_deflection_pct_semispan: 10   # [%] of half-span
  horizontal_tail_tip_deflection_pct_semispan: 10  # [%] of half-span
  vertical_tail_tip_deflection_pct_span: 10        # [%] of full span
  tail_boom_tip_deflection_pct_length: 10  # [%] of bending arm length

# ----- Material selection -----
materials:
  fuselage: EPP
  wing: EPP
  rod: CFRP
  tail: EPP
  rib: CFRP

# ----- Wing ribs -----
ribs:
  thickness: 0.0003      # [m] aluminium rib plate thickness
