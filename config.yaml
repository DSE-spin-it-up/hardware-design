# Design knobs for the sizing pipeline.
# Edit values here and run `python main.py`. The loader at pipeline/config.py
# reads this file and exposes each section as a dataclass on the same module.

# Wing airfoil: .dat path or NACA digits (e.g. "2412"). Set to null to prompt at runtime.
airfoil: "airfoils/E423.dat"

# Tail airfoil: .dat path or NACA digits. Symmetric sections are typical.
tail_airfoil: "airfoils/NACA0010.dat"

# Alpha sweep used to build the wing drag polar for the CL/CD plot [deg].
# [start, end, n_points]
alpha_sweep_deg: [-2.0, 12.0, 30]

# Coarser sweep used inside the iteration loop to find max-L/D CL each pass.
alpha_sweep_loop_deg: [-2.0, 12.0, 140]

# ----- Convergence loop -----
mass_closure: true
sw_closure: true
n_iter_max: 20
cd0_tol: 1.0e-4
mass_tol: 1.0e-3   # kg
sw_tol: 1.0e-3     # m²

# ----- Stall constraint -----
V_stall: 14.0

# ----- CG tuning -----
battery_x: -0.3

# ----- Initial / wing sizing -----
sizing:
  m_payload: 60
  m_drone_empty: 8
  n_drones: 3
  b: 3.0
  AR: 7.5
  lam: 1.0
  Cd0: 0.03
  S_payload: 0.31
  Cd_payload: 1.05
  h_cruise: 100
  V_cruise: 20
  gust_speed: 5.0
  R: 20000
  foam_density: 48
  Vv: 0.04
  Vh: 0.50
  L_boom: 1.75
  ARt: 4.5
  lam_t: 1.0

# ----- Propulsion -----
propulsion:
  csv_prop: data\12x8E_performance.csv
  n_props: 3
  prop_mass: 0.1
  eff_motor: 0.8
  T_W_to: 2.0
  throttle_max: 0.9
  climb_rate: 3.333333
  t_climb: 30
  n_cells: 6
  voltage_cell: 3.7
  battery_density: 250
  DoD: 0.8
  cruise_rpm_init: 7000
  climb_rpm_init: 12000
  rpm_tol: 1.0
  thrust_tol: 1.0
  max_iter: 200
  rpm_step: 50.0
  vtol_rpm_init: 5000
  vtol_thrust_tol: 2.0
  vtol_max_iter: 400
  vtol_rpm_step: 25.0
  verbose: false

# ----- Fuselage -----
# Battery dimensions: off-the-shelf envelope unless both aspect ratios are > 0,
# in which case dimensions are recomputed from the required battery volume.
fuselage:
  battery_length: 0.212
  battery_width: 0.090
  battery_height: 0.060
  AR_lw: 2.355555555555556   # length / width  (= 0.212 / 0.090)
  AR_lh: 3.533333333333333   # length / height (= 0.212 / 0.060)
  casing_factor: 1.15        # all-around EPP foam wall margin (~7.5% per side)
  casing_thickness: 0.001    # [m] minimum hard wall thickness
  tube_tail_overlap: 0.03    # [m] tube extension aft of aileron hinge for boom grip
  min_foam_floor: 0.005      # [m] minimum EPP floor below battery
  pvc_gust_safety_factor: 1.5 # [-] safety factor on upward gust roof load

# ----- Aileron / control surface -----
control_surface:
  cl_alpha: 6.283185307179586
  cd0_section: 0.04
  roll_moment_dist: 0.05
  max_da_deg: 10.0
  max_y_frac: 0.8
  c_aileron_to_c_wing: 0.3

# ----- Elevator -----
elevator:
  eta_h: 0.85
  Cm_dist: 0.0
  max_deflection_up_deg: 25.0
  max_deflection_down_deg: 20.0
  payload_cable_min_angle_deg: 0.0
  payload_cable_max_angle_deg: null  # null -> 2 × equilibrium cable angle

# ----- Rudder -----
rudder:
  max_deflection_deg: 30.0
  Cn_dist: 0.0
  CDY: 0.8
  Kf1: 0.85
  Kf2: 1.0
  eta_v: 0.85
  Ss: null

# ----- CFRP rod sizing -----
structure:
  safety_factor: 1.2
  defl_max: 0.05
  d_to_section_ratio: 0.8
  tail_tc: 0.10

# ----- Material selection -----
materials:
  fuselage: EPP
  wing: EPP
  rod: CFRP
  tail: EPP
